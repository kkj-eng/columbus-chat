<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Talk to Christopher Columbus</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #102f46;
      background: #f4ead5;
    }

    .page {
      width: min(1500px, calc(100% - 24px));
      margin: 0 auto;
      padding: 14px 0;
    }

    .page-header {
      display: grid;
      grid-template-columns: auto minmax(300px, 1fr);
      gap: 36px;
      align-items: center;
      padding: 6px 22px 16px;
    }

    .page-header h1 {
      margin: 0;
      font-size: clamp(2rem, 3.1vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }

    .subtitle {
      max-width: 780px;
      margin: 0 0 0 auto;
      color: #294764;
      font-size: clamp(0.95rem, 1.25vw, 1.15rem);
      line-height: 1.4;
      text-align: right;
    }

    .task-box {
      display: grid;
      grid-template-columns: minmax(400px, 1fr) auto;
      gap: 20px;
      align-items: center;
      margin-bottom: 12px;
      padding: 14px 20px;
      border: 1px solid #d5c8ae;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 6px 18px rgba(22, 50, 79, 0.08);
    }

    .task-text {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .task-box h2 {
      flex: 0 0 auto;
      margin: 0;
      font-size: 1.15rem;
      white-space: nowrap;
    }

    .task-box p {
      margin: 0;
      color: #263c50;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .topics {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    .topic {
      padding: 6px 10px;
      border: 1px solid #b8d3da;
      border-radius: 999px;
      color: #07516a;
      background: #eef8fa;
      font-size: 0.78rem;
      font-weight: bold;
      white-space: nowrap;
    }

    .chat-container {
      width: 100%;
      height: calc(100vh - 190px);
      min-height: 520px;
      overflow: hidden;
      border: 3px solid #0e6275;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 12px 32px rgba(22, 50, 79, 0.16);
    }

    .chat-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    .
