<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Talk to Christopher Columbus</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #102f46;
      background: #f4ead5;
    }

    .page {
      width: min(1600px, calc(100% - 28px));
      margin: 0 auto;
      padding: 12px 0 10px;
    }

    /*
      Kompakt topområde.
      Overskrift og beskrivelse står ved siden af hinanden
      på almindelige computerskærme.
    */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      min-height: 82px;
      padding: 8px 18px 14px;
    }

    .page-header h1 {
      flex: 0 0 auto;
      margin: 0;
      color: #102f46;
      font-size: clamp(2rem, 3vw, 3.15rem);
      line-height: 1;
      letter-spacing: -0.025em;
    }

    .subtitle {
      max-width: 690px;
      margin: 0;
      color: #294764;
      font-size: clamp(0.95rem, 1.3vw, 1.15rem);
      line-height: 1.45;
      text-align: right;
    }

    /*
      Opgave og emner samles i en lav bjælke.
    */
    .task-box {
      display: grid;
      grid-template-columns: minmax(440px, 1fr) auto;
      gap: 24px;
      align-items: center;
      margin-bottom: 12px;
      padding: 13px 18px;
      border: 1px solid #d5c8ae;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 6px 18px rgba(22, 50, 79, 0.08);
    }

    .task-text {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .task-box h2 {
      flex: 0 0 auto;
      margin: 0;
      color: #102f46;
      font-size: 1.18rem;
      white-space: nowrap;
    }

    .task-box p {
      margin: 0;
      color: #263c50;
      font-size: 0.92rem;
      line-height: 1.4;
    }

    .topics {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      max-width: 670px;
    }

    .topic {
      padding: 6px 10px;
      border: 1px solid #b8d3da;
      border-radius: 999px;
      color: #07516a;
      background: #eef8fa;
      font-size: 0.8rem;
      font-weight: bold;
      white-space: nowrap;
    }

    /*
      Chatten bruger resten af den synlige skærmhøjde.

      178 pixels reserveres til:
      - topområde
      - opgavebjælke
      - afstande
    */
    .chat-container {
      width: 100%;
      height: calc(100vh - 178px);
      height: calc(100svh - 178px);
      min-height: 500px;
      overflow: hidden;
      border: 3px solid #0e6275;
      border-radius: 17px;
      background: #ffffff;
      box-shadow: 0 12px 32px rgba(22, 50, 79, 0.16);
    }

    .chat-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    .privacy-note {
      margin: 5px 0 0;
      color: #586873;
      font-size: 0.7rem;
      line-height: 1.3;
      text-align: center;
    }

    footer {
      padding: 5px 10px 0;
      color: #52616b;
      font-size: 0.7rem;
      text-align: center;
    }

    /*
      Tilpasning til lavere computerskærme.
    */
    @media (max-height: 800px) and (min-width: 901px) {
      .page {
        padding-top: 6px;
      }

      .page-header {
        min-height: 66px;
        padding-top: 4px;
        padding-bottom: 9px;
      }

      .page-header h1 {
        font-size: 2.2rem;
      }

      .subtitle {
        font-size: 0.9rem;
      }

      .task-box {
        margin-bottom: 8px;
        padding: 9px 14px;
      }

      .task-box h2 {
        font-size: 1rem;
      }

      .task-box p {
        font-size: 0.8rem;
      }

      .topic {
        padding: 5px 8px;
        font-size: 0.72rem;
      }

      .chat-container {
        height: calc(100vh - 142px);
        min-height: 430px;
      }
    }

    /*
      Tablet.
    */
    @media (max-width: 1100px) {
      .page-header {
        display: block;
        text-align: center;
      }

      .subtitle {
        max-width: 850px;
        margin: 9px auto 0;
        text-align: center;
      }

      .task-box {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .topics {
        justify-content: flex-start;
        max-width: none;
      }

      .chat-container {
        height: calc(100svh - 235px);
        min-height: 520px;
      }
    }

    /*
      Mobil.
    */
    @media (max-width: 700px) {
      .page {
        width: calc(100% - 12px);
        padding-top: 6px;
      }

      .page-header {
        min-height: auto;
        padding: 7px 8px 12px;
      }

      .page-header h1 {
        font-size: 1.75rem;
        line-height: 1.1;
      }

      .subtitle {
        margin-top: 7px;
        font-size: 0.88rem;
        line-height: 1.35;
      }

      .task-box {
        display: block;
        margin-bottom: 8px;
        padding: 12px;
        border-radius: 13px;
      }

      .task-text {
        display: block;
      }

      .task-box h2 {
        margin-bottom: 5px;
        font-size: 1.05rem;
        white-space: normal;
      }

      .task-box p {
        font-size: 0.83rem;
      }

      .topics {
        margin-top: 10px;
        gap: 5px;
      }

      .topic {
        padding: 5px 8px;
        font-size: 0.72rem;
      }

      .chat-container {
        height: 70svh;
        min-height: 520px;
        border-width: 2px;
        border-radius: 13px;
      }

      .privacy-note,
      footer {
        font-size: 0.65rem;
      }
    }

    /*
      Meget smalle mobilskærme.
    */
    @media (max-width: 420px) {
      .topic {
        font-size: 0.68rem;
      }

      .chat-container {
        height: 72svh;
        min-height: 500px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header class="page-header">
      <h1>Talk to Christopher Columbus</h1>

      <p class="subtitle">
        Practise English by interviewing Christopher Columbus.
        Ask questions about his life, voyages and historical perspective.
      </p>
    </header>

    <main>

<section
  class="chat-container"
  aria-label="Chat with Christopher Columbus"
>
  <iframe
    class="chat-frame"
    title="Talk to Christopher Columbus"
    src="https://copilotstudio.microsoft.com/ophercolumbus_SXJnOx/webchat?__version__=2&amp;enableFileAttachment=false&amp;cliAgent=true</iframe>
</section>

      <section
        class="chat-container"
        aria-label="Chat with Christopher Columbus"
      >

        https://copilotstudio.microsoft.com/environments/Default-d3fcb89c-9e3b-4533-a07d-fcd5dd8e7a79/bots/cre4e_talktochristophercolumbus_SXJnOx/webchat?__version__=2&amp;enableFileAttachment=false&amp;cliAgent=true</iframe>

      </section>

      <p class="privacy-note">
        Do not write personal or sensitive information in the chat.
      </p>

    </main>

    <footer>
      HF &amp; VUC NORD · English learning activity
    </footer>

  </div>

</body>
</html>
