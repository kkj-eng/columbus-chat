<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Talk to Christopher Columbus</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #102f46;
      background: #f4ead5;
    }

    .page {
      width: min(1500px, calc(100% - 24px));
      margin: 0 auto;
      padding: 12px 0;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
      padding: 8px 18px 14px;
    }

    .page-header h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3.25rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .subtitle {
      max-width: 720px;
      margin: 0;
      color: #294764;
      font-size: clamp(0.95rem, 1.25vw, 1.15rem);
      line-height: 1.4;
      text-align: right;
    }

    .task-box {
      display: grid;
      grid-template-columns: minmax(430px, 1fr) auto;
      gap: 20px;
      align-items: center;
      margin-bottom: 12px;
      padding: 14px 18px;
      border: 1px solid #d5c8ae;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 6px 18px rgba(22, 50, 79, 0.08);
    }

    .task-text {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .task-box h2 {
      flex: 0 0 auto;
      margin: 0;
      font-size: 1.15rem;
      white-space: nowrap;
    }

    .task-box p {
      margin: 0;
      color: #263c50;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .topics {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    .topic {
      padding: 6px 10px;
      border: 1px solid #b8d3da;
      border-radius: 999px;
      color: #07516a;
      background: #eef8fa;
      font-size: 0.78rem;
      font-weight: bold;
      white-space: nowrap;
    }

    .chat-container {
      width: 100%;
      height: clamp(360px, calc(100vh - 390px), 520px);
      overflow: hidden;
      border: 3px solid #0e6275;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 12px 32px rgba(22, 50, 79, 0.16);
    }

    .chat-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    .privacy-note {
      margin: 6px 0 0;
      color: #586873;
      font-size: 0.72rem;
      text-align: center;
    }

    footer {
      padding: 8px 10px 0;
      color: #52616b;
      font-size: 0.72rem;
      text-align: center;
    }

    /* EXPORT AREA */

    .conversation-export {
      margin-top: 18px;
      padding: 20px;
      border: 1px solid #d5c8ae;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 6px 18px rgba(22, 50, 79, 0.08);
    }

    .conversation-export h2 {
      margin: 0 0 8px;
      color: #102f46;
    }

    .conversation-export p {
      margin-top: 5px;
      color: #263c50;
      line-height: 1.5;
    }

    .conversation-export label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    .conversation-export input,
    .conversation-export textarea {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid #90a4ae;
      border-radius: 10px;
      color: #102f46;
      background: #ffffff;
      font: inherit;
    }

    .conversation-export input:focus,
    .conversation-export textarea:focus {
      outline: 3px solid rgba(14, 98, 117, 0.2);
      border-color: #0e6275;
    }

    .conversation-export textarea {
      min-height: 300px;
      resize: vertical;
      line-height: 1.5;
    }

    .action-buttons {
      text-align: center;
      margin-top: 15px;
    }

    .action-buttons button {
      background: #0e6275;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      margin: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .action-buttons button:hover {
      background: #0b4f5e;
    }

    .action-buttons button:focus {
      outline: 3px solid rgba(14, 98, 117, 0.3);
      outline-offset: 2px;
    }
