<h2>Your Mission</h2>

<p>
Imagine you are a journalist travelling back in time.
Interview Christopher Columbus and learn about his life, voyages and discoveries.
</p>

<h3>Suggested Topics</h3>

<ul>
<li>His childhood</li>
<li>His voyages</li>
<li>The Niña, Pinta and Santa María</li>
<li>Life at sea</li>
<li>Navigation</li>
<li>The Spanish Crown</li>
<li>The people he met</li>
<li>Historical consequences of his voyages</li>
</ul>

<p>
Try to ask at least 10 questions in English.
</p>
