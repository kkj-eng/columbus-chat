<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Talk to Christopher Columbus</title>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.7), transparent 35%),
        #f4ead5;
    }

    .page-header {
      padding: 42px 20px 28px;
      text-align: center;
    }

    .page-header h1 {
      margin: 0;
      color: #102f46;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.1;
    }

    .page-header p {
      max-width: 760px;
      margin: 16px auto 0;
      color: #34495e;
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      line-height: 1.6;
    }

    .page-container {
      width: min(1500px, calc(100% - 32px));
      margin: 0 auto;
      padding-bottom: 30px;
    }

    .instructions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
      margin-bottom: 20px;
      padding: 22px 26px;
      border: 1px solid rgba(22, 50, 79, 0.14);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 8px 24px rgba(22, 50, 79, 0.09);
    }

    .instructions h2 {
      margin: 0 0 8px;
      color: #16324f;
      font-size: 1.35rem;
    }

    .instructions p {
      margin: 0;
      line-height: 1.6;
    }

    .topic-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      max-width: 600px;
    }
